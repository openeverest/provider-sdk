---
name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  # The templates generate writes into provider charts check compatibility
  # with OpenEverest at render time. Their committed copies must match the
  # generator, and they must decide every case OpenEverest publishes, for its
  # check and its acknowledgements, exactly as OpenEverest does.
  helm-unittest:
    name: Helm unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Set up Go
        uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6.4.0
        with:
          go-version-file: 'go.mod'
          cache: true

      - name: Install Helm
        uses: azure/setup-helm@dda3372f752e03dde6b3237bc9431cdc2f7a02a2 # v5.0.0
        with:
          version: v3.22.1

      - name: Check the generated templates and suites are up to date
        run: go test ./hack/gen-compat-tests/ ./internal/scaffold/ -run 'TestFilesAreFresh|TestVectorsSuite|TestAcknowledgeSuite|TestScaffoldContractTemplatesAreGenerated'

      - name: Run the helm-unittest suites
        run: make test-helm
