---
# Triggered when a tag of the form vX.Y.Z (or vX.Y.Z-<suffix>) is pushed.
# Packages the provider Helm chart and pushes it as an OCI artifact to GHCR.
name: Push Helm OCI package

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: read

env:
  REGISTRY: ghcr.io
  CHART_DIR: charts/[[ .ProviderName ]]

jobs:
  push-chart:
    name: Package & push Helm OCI chart
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v4

      - name: Install Helm
        uses: azure/setup-helm@dda3372f752e03dde6b3237bc9431cdc2f7a02a2 # v5.0.0

      - name: Extract version from tag
        id: version
        # Strip the leading "v" to get a SemVer string for Chart.yaml.
        run: echo "VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - name: Stamp chart version and image
        env:
          VERSION: ${{ steps.version.outputs.VERSION }}
        run: |
          cd "$CHART_DIR"
          case "$VERSION" in
            *-*)
              # Pre-release tags point at the -dev image.
              make release-dev VERSION="$VERSION"
              ;;
            *)
              make release VERSION="$VERSION"
              ;;
          esac

      - name: Build chart dependencies
        run: helm dependency build "$CHART_DIR"

      - name: Package Helm chart
        run: |
          mkdir -p release-artifacts
          helm package "$CHART_DIR" --destination release-artifacts/

      - name: Push Helm chart to GHCR OCI registry
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | helm registry login \
            "$REGISTRY" \
            --username "${{ github.actor }}" \
            --password-stdin
          helm push release-artifacts/[[ .ProviderName ]]-*.tgz \
            "oci://${REGISTRY}/${{ github.repository_owner }}/charts"

      - name: Generate install notes
        env:
          VERSION: ${{ steps.version.outputs.VERSION }}
        run: |
          cat > release-artifacts/notes.md <<EOF
          ## [[ .ProviderName ]] v${VERSION}

          ### Image
          \`\`\`
          ${REGISTRY}/${{ github.repository_owner }}/[[ .ProviderName ]]:${VERSION}
          \`\`\`
          Platforms: \`linux/amd64\`, \`linux/arm64\`

          ### Install with Helm
          \`\`\`bash
          helm install [[ .ProviderName ]] \\
            oci://${REGISTRY}/${{ github.repository_owner }}/charts/[[ .ProviderName ]] \\
            --version ${VERSION} -n everest-system
          \`\`\`
          EOF

      - name: Create GitHub release
        uses: softprops/action-gh-release@c95fe1489396fe8a9eb87c0abf8aa5b2ef267fda # v2.2.1
        with:
          name: "v${{ steps.version.outputs.VERSION }}"
          body_path: release-artifacts/notes.md
          append_body: true
          generate_release_notes: true
          prerelease: ${{ contains(github.ref_name, '-') }}
          files: release-artifacts/[[ .ProviderName ]]-*.tgz
          fail_on_unmatched_files: true
