{{- /* No values for failurePolicy, timeout, rules or matchConditions: every provider registers this shape. */}}
{{- $fullname := include "[[ .ProjectName ]].fullname" . }}
{{- $certManager := .Values.admission.certManager.enabled }}
{{- $certs := dict }}
{{- if $certManager }}
apiVersion: cert-manager.io/v1
kind: Issuer
metadata:
  name: {{ $fullname }}-admission
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "[[ .ProjectName ]].labels" . | nindent 4 }}
spec:
  selfSigned: {}
---
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: {{ $fullname }}-admission
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "[[ .ProjectName ]].labels" . | nindent 4 }}
spec:
  secretName: {{ include "[[ .ProjectName ]].admissionSecretName" . }}
  dnsNames:
    - {{ $fullname }}.{{ .Release.Namespace }}.svc
    - {{ $fullname }}.{{ .Release.Namespace }}.svc.cluster.local
  issuerRef:
    kind: Issuer
    name: {{ $fullname }}-admission
{{- else }}
{{- $certs = fromYaml (include "[[ .ProjectName ]].admissionCerts" .) }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "[[ .ProjectName ]].admissionSecretName" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "[[ .ProjectName ]].labels" . | nindent 4 }}
type: kubernetes.io/tls
data:
  {{- range $key, $value := $certs }}
  {{ $key }}: {{ $value | quote }}
  {{- end }}
{{- end }}
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingWebhookConfiguration
metadata:
  name: {{ $fullname }}.openeverest.io
  labels:
    {{- include "[[ .ProjectName ]].labels" . | nindent 4 }}
    app.kubernetes.io/part-of: openeverest
    openeverest.io/provider: {{ .Values.provider.name }}
  {{- if $certManager }}
  annotations:
    cert-manager.io/inject-ca-from: {{ .Release.Namespace }}/{{ $fullname }}-admission
  {{- end }}
webhooks:
  - name: instances.{{ .Values.provider.name }}.openeverest.io
    admissionReviewVersions: [v1]
    sideEffects: None
    failurePolicy: Ignore
    timeoutSeconds: 3
    matchPolicy: Equivalent
    rules:
      - apiGroups: [core.openeverest.io]
        apiVersions: ["*"]
        operations: [CREATE, UPDATE]
        resources: [instances]
        scope: Namespaced
    matchConditions:
      - name: this-provider
        expression: object.spec.providerRef.name == '{{ .Values.provider.name }}'
      - name: not-terminating
        expression: '!has(object.metadata.deletionTimestamp)'
      - name: spec-changed
        expression: request.operation == 'CREATE' || object.spec != oldObject.spec
    clientConfig:
      service:
        namespace: {{ .Release.Namespace }}
        name: {{ $fullname }}
        port: 443
        path: /admission/instances
      {{- if not $certManager }}
      caBundle: {{ index $certs "ca.crt" }}
      {{- end }}
