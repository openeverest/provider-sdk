apiVersion: v1
kind: Service
metadata:
  name: {{ include "[[ .ProjectName ]].fullname" . }}
  labels:
    {{- include "[[ .ProjectName ]].labels" . | nindent 4 }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: http
      protocol: TCP
      name: http
    - port: 443
      targetPort: admission
      protocol: TCP
      name: admission
  selector:
    {{- include "[[ .ProjectName ]].selectorLabels" . | nindent 4 }}
