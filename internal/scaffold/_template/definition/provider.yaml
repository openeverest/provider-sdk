# Provider identity and component definitions.
# Component types define what software each component runs (e.g. mongod, backup).
# Component names are the logical roles used in topologies (e.g. engine, proxy).
#
# Run `provider-sdk add component` to add components interactively.
# For more details, see github.com/openeverest/provider-sdk/blob/main/PROVIDER_DEVELOPMENT.md.

# The name of the Provider CR this repository ships, and the value users put in
# spec.providerRef.name on an Instance. Keep it in sync with
# common.ProviderName and the chart's provider.name value.
name: [[ .ProviderName ]]

# Components map logical component names to their type.
# The type must match a key in versions.yaml's componentTypes.
# Add parametersSchema to reference a Go type from components/types.go
# when a component accepts parameters.
#
# Example:
#   engine:
#     type: mongod
#   backup:
#     type: pbm
components: {}

# Component types map each type used above to its kind: the shared
# classification of the software it runs, which monitoring classes filter on.
# Optional per type, but every type listed in monitoring.yaml needs one.
# Databases use OpenTelemetry db.system.name values (mongodb, mysql,
# postgresql); other software uses names such as haproxy or pgbouncer.
# Version catalogs stay in versions.yaml.
#
# Example:
#   mongod:
#     kind: mongodb
componentTypes: {}
