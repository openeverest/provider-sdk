# Expected outcome of the instance-ready step: once the operator-native CR
# reports ready for its latest generation, the provider's Status() reports
# the cluster converged and available, and the runtime marks the Instance
# Provisioned and Ready.
apiVersion: core.openeverest.io/v1alpha1
kind: Instance
metadata:
  name: test-instance
status:
  phase: Provisioned
  (conditions[?type == 'Ready'].status | [0]): "True"
  (conditions[?type == 'Available'].status | [0]): "True"
